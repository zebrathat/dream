<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>馬力連夢錄</title>
<meta name="apple-mobile-web-app-title" content="馬力連夢錄">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1645">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(170deg, #3B2F7A, #140F33);
    color: #F3EEFF;
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 420px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  h1 { margin: 0; font-size: 26px; letter-spacing: .06em; }
  a.go {
    display: block; width: 100%; padding: 18px; border-radius: 16px;
    background: #FFF1D2; color: #1c1645; font-size: 18px; font-weight: 700; text-decoration: none;
  }
  a.go:focus-visible { outline: 3px solid #B49CF0; outline-offset: 3px; }
  ol { text-align: left; margin: 0; padding-left: 1.3em; line-height: 1.8; color: #CFC6EE; font-size: 15px; }
  p { margin: 0; color: #CFC6EE; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="">
  <h1>馬力連夢錄</h1>

  <!-- Shown when opened from the home screen -->
  <a class="go" id="go" target="_blank" rel="noopener">開啟,記下夢</a>

  <!-- Shown in normal Safari: setup steps -->
  <section id="setup" hidden>
    <ol>
      <li>點 Safari 下方的分享按鈕</li>
      <li>選「加入主畫面」</li>
      <li>保持「打開為網頁 App」開啟,按「加入」</li>
    </ol>
  </section>
  <p id="note" hidden>之後從主畫面的月亮圖示打開,點一下按鈕就會進入。</p>
</main>
<script>
  // The only destination this page ever opens.
  var TARGET = "https://claude.ai/artifact/3CSHMjBpS8yDCmzhRhoGTE";
  var go = document.getElementById("go");
  go.href = TARGET;
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (!standalone) {
    document.getElementById("setup").hidden = false;
    document.getElementById("note").hidden = false;
  }
</script>
</body>
</html>
